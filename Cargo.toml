[package]
edition = "2024"
name = "hazard3-gy-bmi160"
version = "0.5.0"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async no_std I2C driver for the Bosch BMI160 IMU, designed for the Hazard3 ecosystem."
documentation = "https://docs.rs/hazard3-gy-bmi160"
readme = "README.md"
keywords = [
    "hazard3",
    "bmi160",
    "imu",
    "no-std",
    "embedded",
]
categories = [
    "embedded",
    "no-std",
    "hardware-support",
]
license = "GPL-2.0-or-later"
repository = "https://github.com/jorgeandrecastro/hazard3-gy-bmi160"

[lib]
name = "hazard3_gy_bmi160"
path = "src/lib.rs"

[features]
default = ["hazard3"]
hazard3 = ["dep:hazard3-time-backend", "dep:hazard3-sync-backend"]
embassy = ["dep:embassy-time", "dep:embassy-sync"]

[dependencies.embedded-hal-async]
version = "1.0"

[dependencies.hazard3-time-backend]
package = "hazard3-time"
version = "0.1.3"
optional = true
default-features = false

[dependencies.hazard3-sync-backend]
package = "hazard3-sync"
version = "0.1.1"
optional = true
default-features = false

[dependencies.embassy-time]
version = "0.5"
optional = true
default-features = false

[dependencies.embassy-sync]
version = "0.8"
optional = true
default-features = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true